<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>StatMan — team season sheet</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body class="page page--team">
    <nav class="topnav">
      <a class="topnav__brand" href="/">StatMan</a>
      <div class="topnav__links">
        <a href="/">Match</a>
        <a href="/season">Season</a>
        <a href="/season/players">Players</a>
        <a href="/video">Full match video</a>
        <a href="/api/docs">API</a>
      </div>
    </nav>

    <header class="page-hero">
      <p class="eyebrow"><a href="/season">← Tournament table</a></p>
      <h1 id="team-name">Team</h1>
      <p id="team-meta" class="lede"></p>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </header>

    <main>
      <section class="section" id="summary-section" hidden>
        <div class="section__head">
          <h2>Season summary</h2>
          <p>Aggregates across stored matches.</p>
        </div>
        <ul id="summary" class="stat-list stat-list--wide"></ul>
      </section>

      <section class="section">
        <div class="section__head">
          <h2>Match by match</h2>
          <p>Each row is one stored open-data match for this side.</p>
        </div>
        <div class="table-wrap">
          <table id="matches">
            <thead>
              <tr>
                <th>Date</th>
                <th>V</th>
                <th>Opponent</th>
                <th>Score</th>
                <th>R</th>
                <th>xG</th>
                <th>Poss %</th>
                <th>PPDA</th>
                <th>Prog</th>
                <th>Pass %</th>
                <th>Tkl</th>
                <th>Int</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>
    </main>

    <footer class="footer">
      <p><a href="/season">Back to season table</a></p>
    </footer>
    <script src="/static/team.js" type="module"></script>
  </body>
</html>
